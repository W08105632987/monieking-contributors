    <script>
      // Applied before React mounts, so there's no flash of the wrong
      // theme on load — same localStorage key useDarkMode.ts reads.
      // A returning visitor's own explicit choice (light OR dark) is
      // always respected first. Only a brand-new visitor with no
      // stored choice yet defaults to dark now — previously that
      // fallback followed the device's system color-scheme setting,
      // which meant a phone set to light mode would open the app in
      // light mode with no dark mode ever having been seen. Now
      // everyone's first-ever open is dark by default; the toggle on
      // the Login page is how they switch to light if they want it.
      (function () {
        try {
          var stored = localStorage.getItem('monieking-theme');
          var isDark = stored !== 'light';
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
