    <script>
      // Applied before React mounts to avoid a flash of the wrong theme.
      // Only adds the 'dark' class if the user has explicitly chosen dark
      // before. No stored preference = light mode (the new default).
      (function () {
        try {
          var stored = localStorage.getItem('monieking-theme');
          if (stored === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
